version: "3.7"

services:
  postgres-db:
    image: postgres:18
    container_name: postgres-db
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=measure_reader
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    networks:
      - my-network

  my-app:
    build:
      context: ./
    container_name: my-app
    ports:
      - 5001:5000
    depends_on:
      - postgres-db
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres-db:5432/measure_reader
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  db:
